name: Run tests

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
        urwid: [""]
        include:
          # the oldest urwid and Python that setup.py allows
          - python-version: "3.10"
            urwid: "2.1.2"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install . ${{ matrix.urwid && format('urwid=={0}', matrix.urwid) }}

      - name: Run tests
        run: python3 -m unittest --verbose

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Ruff
        run: pipx run ruff==0.15.4 check urwidtrees tests
